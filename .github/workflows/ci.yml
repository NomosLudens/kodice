name: ci

on:
  push:
    branches: [master, feat/**, fix/**, chore/**, release/**, showcase/**]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prove Integral Reproducibility (Corpus, SQLite, Boundaries, Tests, Build, PWA)
        run: bun run reproduce:verify

      - name: Redundancy check - bundled build script
        run: bun run build
