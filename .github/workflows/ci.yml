name: ci

on:
  push:
    branches: [master, feat/**, fix/**, chore/**, release/**, showcase/**]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build & gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Verify Reproducibility (Corpus, SQLite, Boundaries, Tests, Build)
        run: bun run reproduce:verify

      - name: Build + run all bundled gates
        run: bun run build

      - name: Verify PWA assets
        run: bun run verify:pwa
